[alembic]
# Migrations live in the `alembic` directory next to this file.
script_location = alembic

# The application resolves the database URL at runtime (env.py) from
# CHAI_DATABASE_URL / per-environment defaults. This placeholder is only used
# when running `alembic` with no environment configured.
sqlalchemy.url =

# Paths are relative to the directory containing alembic.ini; add the project
# root so `app` is importable from env.py.
prepend_sys_path = .
path_separator = os

# A command-line overrides file is not used.
# version_path_separator = os
# file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# no hooks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
